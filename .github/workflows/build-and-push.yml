name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: ./Dockerfile.api
            image: lyricsdb-api
          - service: web
            dockerfile: ./Dockerfile.web
            image: lyricsdb-web
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push service concurrently
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Optional: Trigger Coolify Webhook to deploy instantly once both images build successfully
  deploy-webhook:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: env.COOLIFY_WEBHOOK != ''
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
    steps:
      - name: Trigger Coolify Deploy Webhook
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
